# Pin the toolchain so contributors and CI compile, format and lint identically.
# `cargo fmt`/`clippy` output differs between Rust releases, which otherwise shows
# up as spurious CI failures on unrelated PRs.
#
# This said `channel = "stable"` until 0.3.1, which pinned nothing — every CI run
# took whatever stable had become that day, and the version contributors saw
# locally was unrelated to the version that built the release. The pin is for
# reproducibility only; it is not load-bearing for any known bug.
#
# Bumping this is a deliberate act: change it here AND in the `toolchain:` inputs
# in .github/workflows/{build,ci}.yml, which cannot read this file.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]

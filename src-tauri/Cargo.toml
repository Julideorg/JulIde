[package]
name = "julide"
version = "0.3.0"
description = "A modern, fully-featured IDE for the Julia programming language"
authors = ["Ofek Bickel"]
license = "MIT"
repository = "https://github.com/sinisterMage/julide"
homepage = "https://github.com/sinisterMage/julide"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "julide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
# Only the features actually used: process spawning + piped stdio (julia.rs,
# lsp.rs, container.rs), task spawning, async mutexes, and one sleep.
# "full" pulled in signal handling, net, fs, and more — dead weight in the binary.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
glob = "0.3"
notify = "8"
dirs = "6"
git2 = { version = "0.20", default-features = false }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
url = "2"
async-trait = "0.1"
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }
# The built-in language server. Linked as a library rather than shipped as a
# sidecar binary: `fatou::lsp::serve` takes an `lsp_server::Connection`, so the
# server runs on a thread inside this process over an in-memory channel pair —
# no child process, no stdio pipes, no PATH lookup, and none of the spawn
# failures those cause (see src/lsp.rs).
#
# `lsp-server` must stay on the same version fatou depends on, or `Connection`
# is a different type and `fatou::lsp::serve` cannot be called at all.
# `cargo tree -d | grep lsp-server` catches a divergence after a fatou bump.
fatou = "0.10"
lsp-server = "0.10"
crossbeam-channel = "0.5"

[features]
vendored-ssl = ["openssl-sys", "git2/vendored-openssl"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop-only: on mobile the platform store handles updates, and the plugin does
# not build there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Only needed to restart after an update is staged.
tauri-plugin-process = "2"
# Restores window size/position across launches.
tauri-plugin-window-state = "2"


# Release builds ship to end users, so trade compile time for a smaller, faster binary.
#
# `panic = "abort"` is deliberately NOT set: several long-lived registries are guarded
# by mutexes whose poison state we recover from (see src/sync.rs), and that recovery
# only works while panics unwind.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The main tsconfig excludes tests and stories, so this covers them too.
      - name: Typecheck tests and stories
        run: bun run typecheck:test

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # Nothing ran these before. A stale generated file is silent by construction:
      # permission-catalog.json is what the plugin registry believes about julIDE's
      # permission model, and plugin-bootstrap.js is what every sandboxed plugin runs.
      - name: Check generated files are current
        run: |
          bun run check:tokens
          bun run check:permission-catalog
          bun run check:plugin-bootstrap
      - name: Test
        run: bun test

  rust:
    name: Rust (fmt + clippy + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Pinned to match rust-toolchain.toml — see the note there. rustfmt and
      # clippy must land on the pinned toolchain, not on whatever stable is today,
      # or their output drifts and unrelated PRs start failing.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev

      # tauri-build needs the frontend dist/ to exist, but does not need it to be
      # a real build — an empty directory is enough for `cargo check`-style jobs.
      - name: Stub frontend dist
        run: mkdir -p dist && touch dist/index.html

      - name: Format check
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test
        working-directory: src-tauri

  # Everything above runs on Linux, and for a long time everything did. That is
  # how a `path_str.contains("/.git/")` filter that cannot match a Windows path,
  # a `JULIA_LOAD_PATH` built with the wrong separator, and three Julia spawns
  # missing CREATE_NO_WINDOW all shipped: `build.yml` compiles for Windows, but
  # nothing has ever *run* there, so no `#[cfg(windows)]` branch and no
  # backslash-shaped assertion was ever executed.
  #
  # Deliberately narrower than the Linux job: no fmt, no clippy, no lint — those
  # are platform-independent and belong in one place. This job exists to execute
  # the tests on the platform whose behaviour they describe.
  windows:
    name: Windows (tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tauri-build needs dist/ to exist, but not to be a real build.
      - name: Stub frontend dist
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType File -Force -Path dist/index.html | Out-Null

      - name: Test (Rust)
        run: cargo test
        working-directory: src-tauri

      # The path <-> URI conversion the language server depends on is frontend
      # code, and `uri.test.ts` checks it against Monaco's own encoder.
      - name: Test (frontend)
        run: bun test

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    # Advisories are published continuously, so a new one appearing must not turn
    # every unrelated PR red. This reports without gating.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # Deliberately left floating, unlike the jobs above: this one never compiles
      # julIDE, it builds cargo-audit from source and reads Cargo.lock. Pinning it
      # would only risk cargo-audit outgrowing the pinned compiler's MSRV.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit
        working-directory: src-tauri

  versions:
    name: Version consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check package.json / Cargo.toml / tauri.conf.json agree
        run: bun run scripts/check-versions.ts

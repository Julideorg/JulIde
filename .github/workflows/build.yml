name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.2.0). Leave empty to build without releasing."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `bun run build` shells out to vite, whose shebang runs it under Node. Node
  # sizes its default heap from the machine's RAM, and on the 7 GB macOS arm64
  # runner that lands at ~2 GB — below what rollup needs to hold the module
  # graph for a bundle this size (Monaco alone is ~4 MB minified). The build
  # then dies with "Ineffective mark-compacts near heap limit" partway through
  # `transforming...`.
  #
  # Measured: the build completes under a 3 GB cap and OOMs under 2 GB, so this
  # is headroom rather than a tuned value. Every runner has at least 7 GB, so
  # asking for 4 GB is safe on all four targets.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Fails fast on a tag build if the updater is not configured, so the mistake
  # surfaces in seconds rather than after four platform builds.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check updater signing is configured
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          PUBKEY=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])")
          if [ "$PUBKEY" = "REPLACE_WITH_UPDATER_PUBLIC_KEY" ]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder."
            echo "Generate a keypair with: bun run tauri signer generate -w ~/.tauri/julide.key"
            echo "Then set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "repo secrets and paste the public key into tauri.conf.json."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set."
            echo "bundle.createUpdaterArtifacts is enabled, so the build will fail without it."
            exit 1
          fi
          echo "Updater signing is configured."

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            cargo_features: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            cargo_features: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            cargo_features: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            cargo_features: "--features vendored-ssl"

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    # Needed only when publishing to a release; harmless otherwise.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned, not @stable, so a release is built by a known compiler rather than
      # whatever shipped that morning. Keep the version in step with
      # rust-toolchain.toml — this action cannot read it, and the target below has
      # to be installed onto the same toolchain cargo will actually use.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Linux system dependencies ──────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev

      # ── Frontend dependencies ──────────────────────────────────
      - name: Install frontend dependencies
        run: bun install

      # ── Resolve the release tag, if any ────────────────────────
      # Empty for a plain build; tauri-action then skips release publishing.
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      # ── Build (and publish, on a tag) ──────────────────────────
      #
      # tauri-action is given the release details rather than a separate release
      # job doing it, because it is what generates and merges `latest.json` — the
      # manifest the updater polls. Each matrix job appends its own platform entry
      # to the same draft release. Hand-assembling that file is easy to get subtly
      # wrong, and a wrong manifest means every installed client fails to update.
      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater manifest. This is the updater's OWN keypair and is
          # unrelated to OS code signing — in-app updates work fine on unsigned
          # builds. Generate with:
          #   bun run tauri signer generate -w ~/.tauri/julide.key
          # then set these two repo secrets and paste the public key into
          # tauri.conf.json under plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} ${{ matrix.cargo_features }}
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: julIDE ${{ steps.tag.outputs.value }}
          releaseDraft: true
          # Renamed from `includeUpdaterJson` in tauri-action v1. The old name is
          # not an input any more, so leaving it would silently stop generating
          # latest.json and break in-app updates for everyone already installed.
          uploadUpdaterJson: true

      # ── Portable Windows executable ────────────────────────────
      #
      # Both Windows bundles install: the `.msi` and the NSIS `.exe` write to
      # Program Files and the registry. Nothing on the release page runs on a
      # machine where you cannot install software, or off a USB stick.
      #
      # No extra build is needed for one. The binary cargo already produced is
      # self-contained: the frontend is compiled into it by tauri-build, and the
      # bundle declares no `resources` and no `externalBin`, so nothing is
      # resolved relative to an install directory at runtime. The portable
      # artifact is that binary, renamed to sit alongside the other Windows
      # assets — `julide_<version>_x64-portable.exe` next to Tauri's own
      # `julide_<version>_x64-setup.exe`.
      #
      # Two caveats, both written up under "The Windows portable build" in the
      # README so they reach the people who download it:
      #   - It needs the WebView2 runtime on the machine. Windows 11 and current
      #     Windows 10 ship it; the installers can bootstrap it, this cannot.
      #   - Settings still live in %APPDATA%, so this is "runs without being
      #     installed", not "leaves no trace".
      - name: Stage portable Windows executable
        id: portable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          NAME="julide_${VERSION}_x64-portable.exe"
          mkdir -p portable
          cp "src-tauri/target/${{ matrix.target }}/release/julide.exe" "portable/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=portable/$NAME" >> "$GITHUB_OUTPUT"

      # tauri-action uploads the bundles it generates; the portable binary is not
      # one of them, so it has to be attached separately. Targeting the release by
      # id rather than by tag matters: the release is a draft, and a draft has no
      # git tag behind it on a workflow_dispatch build.
      #
      # Deliberately NOT added to latest.json. The Windows updater applies an
      # update by running an installer, which would install julIDE beside the
      # portable copy rather than replace it.
      - name: Attach portable executable to the release
        if: runner.os == 'Windows' && steps.tag.outputs.value != '' && steps.tauri.outputs.releaseId != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          ASSET_NAME: ${{ steps.portable.outputs.name }}
          ASSET_PATH: ${{ steps.portable.outputs.path }}
        run: |
          set -euo pipefail
          # Re-running a tag build would otherwise fail with 422 already_exists.
          gh api "/repos/$REPO/releases/$RELEASE_ID/assets" \
            --jq ".[] | select(.name == \"$ASSET_NAME\") | .id" |
            while read -r id; do
              echo "Replacing existing asset $ASSET_NAME (id $id)"
              gh api --method DELETE "/repos/$REPO/releases/$RELEASE_ID/assets/$id"
            done
          gh api --method POST \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET_NAME" \
            --input "$ASSET_PATH" --jq .browser_download_url

      # ── Also keep the installers as workflow artifacts ─────────
      # Useful for non-tag builds, and for grabbing a build without publishing.
      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: julide-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: julide-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            portable/*.exe
          if-no-files-found: error

      - name: Upload build artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: julide-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.2.0). Leave empty to build without releasing."
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fails fast on a tag build if the updater is not configured, so the mistake
  # surfaces in seconds rather than after four platform builds.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check updater signing is configured
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          PUBKEY=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])")
          if [ "$PUBKEY" = "REPLACE_WITH_UPDATER_PUBLIC_KEY" ]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder."
            echo "Generate a keypair with: bun run tauri signer generate -w ~/.tauri/julide.key"
            echo "Then set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "repo secrets and paste the public key into tauri.conf.json."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set."
            echo "bundle.createUpdaterArtifacts is enabled, so the build will fail without it."
            exit 1
          fi
          echo "Updater signing is configured."

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            cargo_features: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            cargo_features: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            cargo_features: ""
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            cargo_features: "--features vendored-ssl"

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    # Needed only when publishing to a release; harmless otherwise.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── Linux system dependencies ──────────────────────────────
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev

      # ── Frontend dependencies ──────────────────────────────────
      - name: Install frontend dependencies
        run: bun install

      # ── Resolve the release tag, if any ────────────────────────
      # Empty for a plain build; tauri-action then skips release publishing.
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      # ── Build (and publish, on a tag) ──────────────────────────
      #
      # tauri-action is given the release details rather than a separate release
      # job doing it, because it is what generates and merges `latest.json` — the
      # manifest the updater polls. Each matrix job appends its own platform entry
      # to the same draft release. Hand-assembling that file is easy to get subtly
      # wrong, and a wrong manifest means every installed client fails to update.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater manifest. This is the updater's OWN keypair and is
          # unrelated to OS code signing — in-app updates work fine on unsigned
          # builds. Generate with:
          #   bun run tauri signer generate -w ~/.tauri/julide.key
          # then set these two repo secrets and paste the public key into
          # tauri.conf.json under plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} ${{ matrix.cargo_features }}
          tagName: ${{ steps.tag.outputs.value }}
          releaseName: julIDE ${{ steps.tag.outputs.value }}
          releaseDraft: true
          includeUpdaterJson: true

      # ── Also keep the installers as workflow artifacts ─────────
      # Useful for non-tag builds, and for grabbing a build without publishing.
      - name: Upload build artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: julide-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

      - name: Upload build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: julide-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload build artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: julide-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: error

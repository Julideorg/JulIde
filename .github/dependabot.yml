version: 2

updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Tauri's crates move in lockstep; separate PRs for each would not build.
      tauri:
        patterns:
          - "tauri"
          - "tauri-*"
      patch-and-minor:
        update-types:
          - patch
          - minor

  # Frontend dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      eslint-and-prettier:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier*"
      patch-and-minor:
        update-types:
          - patch
          - minor
    ignore:
      # `typescript` is deliberately held on 6.x; TypeScript 7 is installed
      # alongside it as `@typescript/native`. See the note in CONTRIBUTING.md —
      # 7.x exposes no programmatic API, so bumping this entry breaks
      # typescript-eslint outright. Drop this ignore once typescript-eslint
      # supports TS >= 7.1.
      - dependency-name: "typescript"
        versions: [">=7"]

  # The workflows themselves
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
